name: hqepl_mobile
description: Q Task360 mobile companion app (Tasks, Tickets, Calendar, Team)
publish_to: 'none'
version: 1.1.0+64

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Locks every Material date picker (task/subtask create, Start/Due
  # fields) to en-GB's DD/MM/YYYY entry format app-wide, regardless of
  # the device's own system locale -- without this, showDatePicker's
  # manual keyboard-entry mode follows whatever locale the phone happens
  # to be set to, which reads MM/DD/YYYY on a US-locale device even
  # though every other date in this app (DateFormat('MMM d, yyyy') etc.)
  # is day-before-month. See main.dart's MaterialApp.router.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.3

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Utilities
  # Pinned to exactly what flutter_localizations (added above, for the
  # DD/MM/YYYY date-picker locale) requires from the SDK -- pub's own
  # solver rejects ^0.19.0 once flutter_localizations is a dependency.
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  table_calendar: ^3.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  android_intent_plus: ^5.1.0
  flutter_background_service: ^5.1.0
  # Independent OS-level watchdog for the overdue alarm (see
  # background_watcher_service.dart's _armWatchdog): AlarmManager runs
  # this on its own schedule, entirely separate from the foreground
  # service's own process lifetime, so it can detect and restart that
  # service even after Android has killed it outright.
  android_alarm_manager_plus: ^4.0.4
  # Optional screenshot attachment on a new support ticket -- matches
  # NewTicketModal.jsx's image picker on the web; also backs the Task
  # detail screen's "Take photo" attachment option.
  image_picker: ^1.1.2
  flutter_alarmkit: ^0.4.0
  # Task detail screen: "Choose document" attachment option (any file
  # type, matching the server's uploadTaskAttachment). file_picker was
  # tried first but both its 8.x and 11.x lines hit native Android build
  # breaks in this project's Gradle setup (a compileSdk mismatch on 8.x,
  # a Kotlin-registration failure on 11.x) -- file_selector is Flutter's
  # own favorite-listed package for this and built cleanly.
  file_selector: ^1.0.3
  # Task detail screen: record a voice message for the comment thread.
  # Pinned to the latest major, not ^5.x -- 5.2.1's own federated
  # sub-packages (record_linux/record_platform_interface) resolved to an
  # inconsistent combination by default (record_linux 0.7.2 doesn't
  # implement record_platform_interface 1.6.0's full API), which broke
  # the Android release build even though Linux isn't a target platform
  # here. 7.x resolves to a self-consistent set.
  record: ^7.0.0
  # Task detail screen: play back a voice message from the comment thread.
  just_audio: ^0.9.42
  # Where record writes its temporary audio file, and where a picked
  # document's path is confirmed to exist before uploading.
  path_provider: ^2.1.4
  # Opens a non-image task attachment (PDF, doc, etc.) in whatever app the
  # phone already has for it, since this app has no in-app document viewer.
  url_launcher: ^6.3.1
  # This install's own version/build number, read at runtime and compared
  # against the server-configured minimum (see app_update_service.dart) --
  # the whole force-update gate depends on this being the actual installed
  # value, not whatever pubspec.yaml's version line says at build time
  # (those two CAN'T drift for a given build, but reading it live avoids
  # ever having to trust a compile-time constant for something this
  # consequential).
  package_info_plus: ^8.1.2
  # Realtime task events (task:created/task:updated) from the same
  # Socket.IO server the web app already connects to (server/config/
  # socket.js, client/src/lib/socket.js) -- see socket_service.dart.
  socket_io_client: ^2.0.3+1
  # Remote push (FCM) -- the only way to alert a person on a task
  # change while the app is fully closed. Unlike socket_io_client above
  # (which needs a live connection, so only works foregrounded) and
  # Android's background_watcher_service.dart (Android-only background
  # polling, see CLAUDE.md), FCM is delivered by the OS itself even
  # with the app not running. iOS in particular has no other path to
  # this -- Apple gives third-party apps no equivalent to Android's
  # foreground-service polling.
  # Bumped to 4.x (from 3.x) -- required by the firebase_messaging fix
  # branch pinned below via dependency_overrides.
  firebase_core: ^4.15.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# TEMPORARY -- pinned to the Firebase team's own draft fix branch for
# https://github.com/firebase/flutterfire/issues/18699: on a UIScene-based
# app where AppDelegate owns UNUserNotificationCenter's delegate (exactly
# this app's setup -- see ios/Runner/AppDelegate.swift), firebase_messaging
# forces UNNotificationPresentationOptionNone in willPresentNotification
# regardless of what flutter_local_notifications' own show() call
# requested, silently hiding every foreground push-triggered local
# notification even though show() itself reports success. Confirmed via
# that issue thread as an exact reproduction of this app's symptom
# (foreground banner never appears, Notification Center/Lock Screen never
# show it either, no error anywhere). Remove this override and go back to
# a normal ^ constraint once the fix ships in a released firebase_messaging
# version -- check https://github.com/firebase/flutterfire/pull/18701.
dependency_overrides:
  firebase_messaging:
    git:
      url: https://github.com/firebase/flutterfire.git
      ref: messaging_18699
      path: packages/firebase_messaging/firebase_messaging

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/app_logo_icon.png
    - assets/images/app_logo_adaptive_fg.png

# Generates the native Android/iOS launcher (home-screen) icon from the
# same brand mark used on the splash screen -- run
# `dart run flutter_launcher_icons` after editing this. adaptive_icon_*
# gives Android a proper adaptive icon (mark on a white disc) instead of
# letterboxing the whole square image, which would otherwise crop badly
# on circular/rounded-square launcher masks.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true # App Store rejects icons with transparency
  # Padded variants (see tool/pad_logo.dart) -- the raw app_logo.png
  # fills its canvas edge-to-edge, which crops badly once Android's
  # adaptive-icon mask (circle/rounded-square/squircle) is applied.
  image_path: "assets/images/app_logo_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo_adaptive_fg.png"
